# peak-task 镜像的参考封装。重构后 Peak 的 `docker` 执行模式是 Cairn 形式：
# Runtime 在宿主机调度，每个 Project 一个长驻 worker 容器（`sleep infinity`），
# `docker exec` 推 worker 命令，零宿主机挂载（graph 走 prompt、API key 走
# worker env、Skills 走 `docker cp`）。task.json `execution.mode: docker` 自动管理这些容器，
# 日常任务不需要 compose；本文件仅用于手动构建镜像或纳入既有编排体系。
# 兼容 `docker compose` 与 `podman-compose`（Dockerfile 本身引擎无关）。
#
# Android 设备接入（device-bridge.sh）与 task.json `execution.networkMode`
# 见 container/AUTH.md。
services:
  peak-task:
    image: peak-task:${PEAK_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # network_mode: host   # 等价 task.json execution.networkMode，按需打开
    command: ["sleep", "infinity"]
