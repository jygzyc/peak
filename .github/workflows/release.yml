name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pack
        run: npm run pack

      - name: Read version
        id: version
        run: |
          echo "value=$(cat version | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Peak ${{ steps.version.outputs.value }}
          body_path: RELEASE.md
          files: |
            dist-packages/*.tgz
            dist-packages/manifest.json
