name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release consumes only the prebuilt artifacts committed under
      # dist-packages/ (produced by `npm run pack` and verified by CI on
      # main). Nothing is rebuilt on a tag: the tag, manifest, and tarball
      # must all agree, otherwise the Release fails fast.
      - name: Verify packaged artifacts match the tag
        id: verify
        run: |
          set -euo pipefail
          manifest="dist-packages/manifest.json"
          test -f "$manifest" || { echo "missing $manifest; run 'npm run pack' and commit dist-packages/" >&2; exit 1; }
          version="$(node -p "require('./$manifest').version")"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "packaged version ($version) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          tarball="dist-packages/$(node -p "require('./$manifest').fileName")"
          test -f "$tarball" || { echo "missing $tarball" >&2; exit 1; }
          actual="$(sha256sum "$tarball" | cut -d' ' -f1)"
          [ "$actual" = "$(node -p "require('./$manifest').sha256")" ] || { echo "sha256 mismatch for $tarball" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Peak ${{ steps.verify.outputs.version }}
          body_path: RELEASE.md
          files: |
            dist-packages/*.tgz
            dist-packages/manifest.json
