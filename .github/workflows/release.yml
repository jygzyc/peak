name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Release consumes only the artifacts packed by the main-branch CI run
      # for this exact commit (uploaded by ci.yml). Nothing is rebuilt on a
      # tag; if the commit has no successful CI run (e.g. a [skip ci]
      # commit), the release fails fast instead of publishing unverified
      # artifacts.
      - name: Find CI run for this commit
        id: ci-run
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              event: 'push',
              status: 'success',
              per_page: 1,
            });
            if (runs.total_count === 0) {
              core.setFailed(`no successful CI run for commit ${context.sha}; push it to main, let CI pass, then tag`);
              return;
            }
            core.setOutput('run_id', runs.workflow_runs[0].id);

      - name: Download packed artifacts
        uses: actions/download-artifact@v4
        with:
          name: peak-dist-packages
          run-id: ${{ steps.ci-run.outputs.run_id }}
          path: dist-packages/

      - name: Verify packaged artifacts match the tag
        id: verify
        run: |
          set -euo pipefail
          manifest="dist-packages/manifest.json"
          test -f "$manifest" || { echo "missing $manifest" >&2; exit 1; }
          version="$(node -p "require('./$manifest').version")"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "packaged version ($version) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          tarball="dist-packages/$(node -p "require('./$manifest').fileName")"
          test -f "$tarball" || { echo "missing $tarball" >&2; exit 1; }
          actual="$(sha256sum "$tarball" | cut -d' ' -f1)"
          [ "$actual" = "$(node -p "require('./$manifest').sha256")" ] || { echo "sha256 mismatch for $tarball" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Peak ${{ steps.verify.outputs.version }}
          body_path: RELEASE.md
          files: |
            dist-packages/*.tgz
            dist-packages/manifest.json
