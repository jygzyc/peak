name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # npm Trusted Publishing: the npm CLI exchanges this OIDC token for a
  # short-lived publish credential; no NPM_TOKEN secret is stored.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # package-lock.json is intentionally not tracked, so install from
      # package.json rather than `npm ci`.
      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck:all

      # Build and pack in this same action: `npm run pack` bundles dist/,
      # verifies `dist/cli.js workers`, and writes dist-packages/*.tgz +
      # manifest.json. Only those packed artifacts go to npm and the Release.
      - name: Pack
        run: npm run pack

      - name: Verify tag matches version
        id: version
        run: |
          version="$(cat version | tr -d '\r\n')"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "version file ($version) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push task image
        uses: docker/build-push-action@v7
        with:
          context: container
          platforms: linux/amd64
          push: true
          tags: |
            jygzyc/peak-task:${{ steps.version.outputs.value }}
            jygzyc/peak-task:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trusted Publishing requires npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      # Publish the exact packed+verified tarball (not a fresh `npm publish`
      # from the repo root) so the npm artifact is byte-identical to the
      # GitHub Release artifact and no second prepack rebuild happens.
      # The ./ prefix is required: a bare `dir/name.tgz` matches npm's
      # `org/repo` GitHub shorthand and is refused with EALLOWGIT.
      - name: Publish to npm
        run: npm publish "./dist-packages/$(node -p "require('./dist-packages/manifest.json').fileName")"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Peak ${{ steps.version.outputs.value }}
          body_path: RELEASE.md
          files: |
            dist-packages/*.tgz
            dist-packages/manifest.json
