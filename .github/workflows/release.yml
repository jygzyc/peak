name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is intentionally not tracked, so install from
      # package.json rather than `npm ci`.
      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # Build and pack in this same action: `npm run pack` bundles dist/,
      # verifies `dist/cli.js workers`, and writes dist-packages/*.tgz +
      # manifest.json. Only those packed artifacts go to the Release.
      - name: Pack
        run: npm run pack

      - name: Verify tag matches version
        id: version
        run: |
          version="$(cat version | tr -d '\r\n')"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "version file ($version) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Peak ${{ steps.version.outputs.value }}
          body_path: RELEASE.md
          files: |
            dist-packages/*.tgz
            dist-packages/manifest.json
