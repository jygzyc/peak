name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 支持 [skip ci] 提交信息跳过 CI（release.yml 为 tag 触发，不适用此机制）。
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke
        run: npm run smoke

      - name: Pack
        run: npm run pack
