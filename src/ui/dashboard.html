#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}#viewport.dragging{cursor:grabbing}#graph{width:100%;height:100%;display:block}.layout-label{font:750 10px Inter,system-ui,sans-serif;letter-spacing:.14em;fill:#8b96a8}.layout-rule{stroke:#dce2eb;stroke-width:1;stroke-dasharray:4 7}.graph-node{cursor:grab;touch-action:none;user-select:none;transition:opacity .22s ease,filter .22s ease}.graph-node.dragging{cursor:grabbing}.graph-node.context-dimmed{opacity:.16;filter:blur(1.7px) saturate(.45)}.graph-node rect{filter:drop-shadow(0 5px 8px rgba(30,41,59,.08));transition:stroke-width .15s,filter .15s}.graph-node:hover rect,.graph-node.selected rect,.graph-node.intent-endpoint rect{stroke-width:3;filter:drop-shadow(0 8px 12px rgba(30,41,59,.15))}.node-id{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em}.node-type{font:750 9px Inter,system-ui,sans-serif;letter-spacing:.11em}.node-text{font:12px Inter,system-ui,sans-serif;fill:#344054}.intent-edge{transition:opacity .2s ease,filter .2s ease}.intent-edge.context-dimmed{opacity:.1;filter:blur(1.2px)}.edge-casing,.edge,.edge-hit{vector-effect:non-scaling-stroke}.edge-casing{fill:none;stroke:var(--canvas);stroke-width:calc(9px * var(--edge-scale,1));stroke-linecap:round;stroke-linejoin:round}.edge{fill:none;stroke:var(--edge-color);stroke-width:calc(2.6px * var(--edge-scale,1));stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);filter:drop-shadow(0 1px 1px color-mix(in srgb,var(--edge-color) 22%,transparent));transition:stroke-width .16s,filter .16s}.intent-edge:hover .edge{stroke-width:calc(3.4px * var(--edge-scale,1));filter:drop-shadow(0 0 4px color-mix(in srgb,var(--edge-color) 46%,transparent))}.edge.branch{marker-end:none;stroke:color-mix(in srgb,var(--edge-color) 76%,#94a3b8)}.edge.open{stroke:var(--edge-color);stroke-dasharray:8 6;marker-end:url(#arrow);opacity:.84}.edge.open.branch{marker-end:none}.edge.running{stroke:var(--edge-color);stroke-width:calc(3.8px * var(--edge-scale,1));stroke-dasharray:12 7;marker-end:url(#arrow);opacity:1;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--edge-color) 62%,transparent));animation:peak-run-dash .68s linear infinite,peak-run-glow 1.15s ease-in-out infinite alternate}@keyframes peak-run-dash{to{stroke-dashoffset:-38}}@keyframes peak-run-glow{from{filter:drop-shadow(0 0 2px color-mix(in srgb,var(--edge-color) 42%,transparent))}to{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--edge-color) 76%,transparent))}}.edge.running.branch{marker-end:none}.edge.selected{stroke:var(--edge-color);stroke-width:calc(4.25px * var(--edge-scale,1));marker-end:url(#arrow);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--edge-color) 55%,transparent))}.edge.selected.branch{marker-end:none}.edge.dragging{stroke-width:calc(4.25px * var(--edge-scale,1))}.edge-junction{fill:#fff;stroke:var(--edge-color);stroke-width:2.4;filter:drop-shadow(0 1px 2px color-mix(in srgb,var(--edge-color) 30%,transparent))}.edge-junction.open{stroke:var(--edge-color)}.edge-junction.selected{stroke:var(--edge-color);stroke-width:3.5}.open-terminal{fill:color-mix(in srgb,var(--edge-color) 12%,white);stroke:var(--edge-color);stroke-width:2.8}.open-terminal.running{fill:color-mix(in srgb,var(--edge-color) 18%,white);stroke:var(--edge-color);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--edge-color) 50%,transparent))}.edge-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}.intent-label{cursor:grab;touch-action:none;user-select:none}.intent-label.dragging{cursor:grabbing}.intent-label rect{fill:color-mix(in srgb,var(--edge-color) 7%,white);stroke:color-mix(in srgb,var(--edge-color) 58%,#cbd5e1);stroke-width:1.15;filter:drop-shadow(0 3px 6px rgba(30,41,59,.1))}.intent-label text{font:780 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;fill:color-mix(in srgb,var(--edge-color) 84%,#172033)}.intent-label.open rect{fill:color-mix(in srgb,var(--edge-color) 8%,white);stroke:var(- .inspector{min-height:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.tab{border:0;background:#fff;padding:13px;color:#8792a3;font-size:12px;font-weight:700;border-bottom:2px solid transparent}.tab.active{color:#4f46e5;border-bottom-color:#6366f1}.panel{min-height:0;overflow:auto;padding:16px}.detail-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 7px rgba(30,41,59,.04)}.detail-head{padding:11px 13px;background:#f8fafc;border-bottom:1px solid #edf0f4;display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head code{font-size:11px;font-weight:750;color:#5146bd}.detail-body{padding:14px}.detail-body p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#3c4658}.meta{margin:14px 0 0;padding:12px 0 0;border-top:1px solid #edf0f4;display:grid;gap:8px}.meta div{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:11px}.meta dt{color:#98a2b3}.meta dd{margin:0;color:#596579;text-align:right;overflow-wrap:anywhere}.meta dd.path{font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left;color:#4338ca;word-break:break-all}.artifact{display:inline-block;margin-top:12px;color:#4f46e5;text-decoration:none;font-size:12px;font-weight:650}.placeholder{padding:34px 13px;text-align:center;border:1px dashed #d9dfe8;border-radius:13px;color:#9aa5b4}.hint-compose{border:1px solid #f0d7ad;border-radius:14px;padding:13px;background:#fffaf1}.hint-compose label{display:block;margin-bottom:6px;font-size:11px;font-weight:720;color:#9b651c}.hint-compose textarea,.hint-compose input,.auth-card input{width:100%;border:1px solid #d9dfe7;border-radius:9px;background:#fff;padding:9px 10px;outline:none}.hint-compose textarea{min-height:90px;resize:vertical}.hint-compose textarea:focus,.hint-compose input:focus,.auth-card input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.11)}.compose-foot{display:flex;align-items:end;gap:8px;margin-top:8px}.compose-foot .actor{flex:1}.hint-list{display:grid;gap:9px;margin-top:13px}.hint-card{border:1px solid #f0dfbf;border-radius:12px;background:#fff;padding:11px;text-align:left;width:100%}.hint-card:hover{background:#fffcf5}.hint-card.selected{border-color:#e6a943;box-shadow:0 0 0 2px rgba(230,169,67,.13)}.hint-card p{margin:7px 0 0;color:#4d5767;white-space:pre-wrap;overflow-wrap:anywhere}.hint-meta{display:flex;justify-content:space-between;gap:7px;color:#a27331;font-size:10px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;padding:10px 14px;background:#172033;color:#fff;border-radius:10px;box-shadow:var(--shadow);font-size:12px}.toast.error{background:#a62d43}
.auth{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.3);backdrop-filter:blur(8px)}.auth-card{width:min(390px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(15,23,42,.24)}.auth-card h2{margin:0 0 5px}.auth-card p{margin:0 0 16px;color:var(--muted)}.auth-card .btn{width:100%;margin-top:10px;padding:9px}.mobile-projects{display:none}
@media(max-width:1050px){.shell{grid-template-columns:250px minmax(0,1fr) 290px}.project-heading strong{max-width:28vw}}
@media(max-width:820px){.shell{grid-template-columns:1fr;grid-template-rows:58px minmax(0,1fr) 270px}.sidebar{display:none}.workspace{grid-column:1}.inspector{grid-column:1;border-left:0;border-top:1px solid var(--line)}.mobile-projects{display:block;max-width:42vw;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px}.brand span{display:none}.toolbar .label{display:none}.legend{display:none}}

<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 18 5-7 3 4 3-6 5 9"/><path d="M4 20h16"/></svg></span><span>Peak Graph</span></div>
    <select id="mobile-projects" class="mobile-projects" aria-label="Source"></select>
    <div id="project-heading" class="project-heading hidden"><strong id="project-title"></strong><span id="project-status" class="status"></span></div>
    <div class="spacer"></div>
    <div class="toolbar">
      <span id="runtime-badge" class="status runtime" title="Runtime heartbeat status">runtime offline</span>
      <button id="export" class="btn hidden"><span class="label">Snapshot</span></button>
      <button id="status-action" class="btn warn hidden"></button>
      <button id="refresh" class="btn icon-btn" title="Refresh" aria-label="Refresh">↻</button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="side-head"><span class="eyebrow">Sources</span><span id="project-count" class="eyebrow">0</span></div>
    <div id="project-list" class="project-list"><div class="empty">Loading…</div></div>
  </aside>

  <main class="workspace">
    <div class="graph-tools"><button id="fit" class="btn icon-btn" title="Fit graph" aria-label="Fit graph">⌗</button><button id="arrange" class="btn icon-btn" title="Reset node layout" aria-label="Reset node layout">↦</button></div>
    <div id="canvas-empty" class="canvas-empty"><div><strong>Select a Source</strong>Choose a source to inspect its proof graph.</div></div>
    <div id="viewport" class="hidden"><svg id="graph" role="img" aria-label="Source proof DAG, with Facts connected left to right by directed Intent edges"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs><g id="scene"></g></svg></div>
    <div id="legend" class="legend hidden"><span><i class="dot"></i>Fact</span><span><i class="dot external"></i>External Fact</span><span><i class="dot intent"></i>Intent · unique color</span><span><i class="dot hint"></i>Hint</span></div>
  </main>

  <aside class="inspector">
    <div class="tabs"><button class="tab active" data-tab="detail">Detail</button><button class="tab" data-tab="hints">Hints <span id="hint-count">0</span></button></div>
    <div id="detail-panel" class="panel"><div class="placeholder">Select a Fact, Intent edge, or Hint.</div></div>
    <div id="hints-panel" class="panel hidden">
      <form id="hint-form" class="hint-compose">
        <label for="hint-content">Add guidance to this Source project</label>
        <textarea id="hint-content" maxlength="1024" required placeholder="What should the runtime reconsider, verify, or prioritize?"></textarea>
        <div class="compose-foot"><div class="actor"><label for="hint-creator">Creator</label><input id="hint-creator" maxlength="120" value="human:web" required></div><button class="btn primary" type="submit">Add Hint</button></div>
      </form>
      <div id="hint-list" class="hint-list"></div>
    </div>
  </aside>
</div>
<div id="auth" class="auth hidden"><form id="auth-form" class="auth-card"><h2>API token required</h2><p>Enter the bearer token configured for this Peak server.</p><input id="token" type="password" autocomplete="current-password" required placeholder="Bearer token"><button class="btn primary" type="submit">Connect</button></form></div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module">
const $=(selector)=>document.querySelector(selector);
const ns='http://www.w3.org/2000/svg';
const state={projects:[],graph:null,resolved:new Map(),projectId:null,selected:null,tab:'detail',token:sessionStorage.getItem('peak-token')||'',signature:'',camera:{x:0,y:0,k:1},bounds:{x:0,y:0,width:1,height:1},layout:null,layers:null,suppressNodeClick:null,suppressIntentClick:null,fittedProject:null,refreshing:false,runtime:{online:false,heartbeatAt:0,windowMs:15000,schedulerRunning:false},executions:[],executionsByIntent:new Map()};
const els={list:$('#project-list'),count:$('#project-count'),mobile:$('#mobile-projects'),heading:$('#project-heading'),title:$('#project-title'),status:$('#project-status'),statusAction:$('#status-action'),runtimeBadge:$('#runtime-badge'),export:$('#export'),empty:$('#canvas-empty'),viewport:$('#viewport'),scene:$('#scene'),legend:$('#legend'),detail:$('#detail-panel'),hints:$('#hints-panel'),hintCount:$('#hint-count'),hintList:$('#hint-list'),hintForm:$('#hint-form'),content:$('#hint-content'),creator:$('#hint-creator'),auth:$('#auth'),token:$('#token'),toast:$('#toast')};
els.creator.value=localStorage.getItem('peak-hint-creator')||'human:web';

async function api(path,options={}){
  const headers=new Headers(options.headers||{});if(state.token)headers.set('authorization',`Bearer ${state.token}`);
  if(options.body&&!headers.has('content-type'))headers.set('content-type','application/json');
  const response=await fetch(path,{...options,headers});
  if(response.status===401){els.auth.classList.remove('hidden');throw new Error('Authentication required');}
  const text=await response.text();
  if(!response.ok){let message=text;try{message=JSON.parse(text).error||text}catch{}throw new Error(message||`HTTP ${response.status}`)}
  if(response.status===204||!text)return null;
  const type=response.headers.get('content-type')||'';return type.includes('json')?JSON.parse(text):text;
}
async function refresh(manual=false){
  if(state.refreshing)return;state.refreshing=true;
  try{
    await loadRuntime();
    const projects=await api('/api/projects');state.projects=projects;renderProjectList();
    if(state.projectId&&!projects.some(p=>p.id===state.projectId)){state.projectId=null;state.graph=null;history.replaceState(null,'',location.pathname);renderEmpty();}
    if(state.projectId)await loadGraph(manual);
    else if(projects.length===1)await selectProject(projects[0].id);
  }catch(error){if(error.message!=='Authentication required')notify(error.message,true)}finally{state.refreshing=false}
}
async function loadRuntime(){
  // peak serve does not inject the runtime extensions, so /api/runtime/status
  // 404s; that is a normal downgrade, not an auth or graph failure.
  try{
    const status=await api('/api/runtime/status');
    state.runtime.windowMs=Number(status.heartbeatWindowMs)||state.runtime.windowMs;
    state.runtime.heartbeatAt=Number(status.heartbeatAt)||0;
    state.runtime.schedulerRunning=Boolean(status.schedulerRunning);
    state.runtime.online=Date.now()-state.runtime.heartbeatAt<=state.runtime.windowMs;
  }catch{state.runtime.online=false}
  renderRuntimeBadge();
  if(state.projectId&&state.runtime.online){
    try{state.executions=await api(`/api/runtime/projects/${encodeURIComponent(state.projectId)}/executions`)}
    catch{state.executions=[]}
  }else state.executions=[];
  state.executionsByIntent=new Map(state.executions.filter(item=>item.intentId).map(item=>[item.intentId,item]));
  const sig=executionSignature();
  if(state.graph){if(sig!==lastExecutionSignature){renderGraph()}else{redrawEdges()}renderDetail()}
  lastExecutionSignature=sig;
}
function renderRuntimeBadge(){
  const online=state.runtime.online;
  els.runtimeBadge.textContent=online?(state.runtime.schedulerRunning?'runtime online':'runtime stopping'):'runtime offline';
  els.runtimeBadge.className=`status runtime${online?' online':''}`;
}
/** Triggers a graph rebuild when the live execution overlay changes, since an
 *  open→running transition does not alter the Graph signature that loadGraph
 *  uses to skip redundant renders. */
function executionSignature(){return JSON.stringify(state.executions.map(item=>[item.executionId,item.intentId,item.processId,item.workerName]))}
let lastExecutionSignature='';
function renderProjectList(){
  els.count.textContent=String(state.projects.length);els.list.replaceChildren();els.mobile.replaceChildren();
  const option=document.createElement('option');option.value='';option.textContent='Select source';els.mobile.append(option);
  if(!state.projects.length){els.list.innerHTML='<div class="empty"><strong>No Sources</strong>Project sources created by Peak will appear here.</div>';return}
  for(const project of state.projects){
    const button=document.createElement('button');button.className=`project-card${project.id===state.projectId?' active':''}`;button.type='button';
    const row=document.createElement('div');row.className='project-card-title';const title=document.createElement('span');title.textContent=project.title;const badge=document.createElement('span');badge.className=`status ${project.status}`;badge.textContent=project.status;row.append(title,badge);
    const date=document.createElement('p');date.textContent=`Created ${formatDate(project.createdAt)}`;const id=document.createElement('code');id.textContent=project.id;button.append(row,date,id);button.onclick=()=>selectProject(project.id);els.list.append(button);
    const item=document.createElement('option');item.value=project.id;item.textContent=`${project.title} · ${project.status}`;item.selected=project.id===state.projectId;els.mobile.append(item);
  }
}
async function selectProject(id){
  state.projectId=id;state.selected=null;state.signature='';state.fittedProject=null;location.hash=id;renderProjectList();await loadGraph(true);
}
async function loadGraph(force=false){
  const graph=await api(`/api/projects/${encodeURIComponent(state.projectId)}`);const signature=JSON.stringify(graph);
  const refs=[];const seen=new Set();for(const intent of graph.intents)for(const ref of intent.from)if(ref.projectId!==state.projectId){const key=refKey(ref);if(!seen.has(key)){seen.add(key);refs.push(ref)}}
