<style>

.workspace{min-width:0;min-height:0;position:relative;overflow:hidden;background-color:#f8fafc;background-image:radial-gradient(#dce2ea 1px,transparent 1px);background-size:22px 22px}.canvas-empty,.loading{position:absolute;inset:0;display:grid;place-items:center;color:#8a96a8;text-align:center;padding:24px}.canvas-empty strong{display:block;color:#566176;font-size:16px;margin-bottom:5px}.graph-tools{position:absolute;left:14px;top:14px;z-index:3;display:flex;gap:6px}.legend{position:absolute;left:14px;bottom:14px;z-index:3;display:flex;gap:12px;padding:8px 11px;border:1px solid rgba(217,223,232,.9);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-radius:10px;color:#6f7a8c;font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:3px;background:#fff;border:2px solid #6366f1}.dot.intent{border-radius:999px;border-color:#8b5cf6}.dot.hint{border-color:#e9a23b;background:#fff8e8}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}#viewport.dragging{cursor:grabbing}#graph{width:100%;height:100%;display:block}.graph-node{cursor:pointer}.graph-node rect{filter:drop-shadow(0 5px 8px rgba(30,41,59,.08));transition:stroke-width .15s,filter .15s}.graph-node:hover rect,.graph-node.selected rect{stroke-width:3;filter:drop-shadow(0 8px 12px rgba(30,41,59,.15))}.node-id{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em}.node-type{font:700 9px Inter,system-ui,sans-serif;letter-spacing:.11em}.node-text{font:12px Inter,system-ui,sans-serif;fill:#344054}.edge{fill:none;stroke:#9a8fce;stroke-width:2;marker-end:url(#arrow)}.edge.open{stroke:#d29a48;stroke-dasharray:6 5;marker-end:url(#arrow-open)}.edge.selected{stroke:#5b4fd1;stroke-width:3.5}.edge-hit{fill:none;stroke:transparent;stroke-width:15;cursor:pointer}.edge-label{font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7468a9;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round;cursor:pointer}
.inspector{min-height:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.tab{border:0;background:#fff;padding:13px;color:#8792a3;font-size:12px;font-weight:700;border-bottom:2px solid transparent}.tab.active{color:#4f46e5;border-bottom-color:#6366f1}.panel{min-height:0;overflow:auto;padding:16px}.detail-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 7px rgba(30,41,59,.04)}.detail-head{padding:11px 13px;background:#f8fafc;border-bottom:1px solid #edf0f4;display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-head code{font-size:11px;font-weight:750;color:#5146bd}.detail-body{padding:14px}.detail-body p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#3c4658}.meta{margin:14px 0 0;padding:12px 0 0;border-top:1px solid #edf0f4;display:grid;gap:8px}.meta div{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:11px}.meta dt{color:#98a2b3}.meta dd{margin:0;color:#596579;text-align:right;overflow-wrap:anywhere}.artifact{display:inline-block;margin-top:12px;color:#4f46e5;text-decoration:none;font-size:12px;font-weight:650}.placeholder{padding:34px 13px;text-align:center;border:1px dashed #d9dfe8;border-radius:13px;color:#9aa5b4}.hint-compose{border:1px solid #f0d7ad;border-radius:14px;padding:13px;background:#fffaf1}.hint-compose label{display:block;margin-bottom:6px;font-size:11px;font-weight:720;color:#9b651c}.hint-compose textarea,.hint-compose input,.auth-card input{width:100%;border:1px solid #d9dfe7;border-radius:9px;background:#fff;padding:9px 10px;outline:none}.hint-compose textarea{min-height:90px;resize:vertical}.hint-compose textarea:focus,.hint-compose input:focus,.auth-card input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.11)}.compose-foot{display:flex;align-items:end;gap:8px;margin-top:8px}.compose-foot .actor{flex:1}.hint-list{display:grid;gap:9px;margin-top:13px}.hint-card{border:1px solid #f0dfbf;border-radius:12px;background:#fff;padding:11px;text-align:left;width:100%}.hint-card:hover{background:#fffcf5}.hint-card.selected{border-color:#e6a943;box-shadow:0 0 0 2px rgba(230,169,67,.13)}.hint-card p{margin:7px 0 0;color:#4d5767;white-space:pre-wrap;overflow-wrap:anywhere}.hint-meta{display:flex;justify-content:space-between;gap:7px;color:#a27331;font-size:10px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;padding:10px 14px;background:#172033;color:#fff;border-radius:10px;box-shadow:var(--shadow);font-size:12px}.toast.error{background:#a62d43}
.auth{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.3);backdrop-filter:blur(8px)}.auth-card{width:min(390px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(15,23,42,.24)}.auth-card h2{margin:0 0 5px}.auth-card p{margin:0 0 16px;color:var(--muted)}.auth-card .btn{width:100%;margin-top:10px;padding:9px}.mobile-projects{display:none}
@media(max-width:1050px){.shell{grid-template-columns:250px minmax(0,1fr) 290px}.project-heading strong{max-width:28vw}}
@media(max-width:820px){.shell{grid-template-columns:1fr;grid-template-rows:58px minmax(0,1fr) 270px}.sidebar{display:none}.workspace{grid-column:1}.inspector{grid-column:1;border-left:0;border-top:1px solid var(--line)}.mobile-projects{display:block;max-width:42vw;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px}.brand span{display:none}.toolbar .label{display:none}.legend{display:none}}
</style>

<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 18 5-7 3 4 3-6 5 9"/><path d="M4 20h16"/></svg></span><span>Peak Graph</span></div>
    <select id="mobile-projects" class="mobile-projects" aria-label="Project"></select>
    <div id="project-heading" class="project-heading hidden"><strong id="project-title"></strong><span id="project-status" class="status"></span></div>
    <div class="spacer"></div>
    <div class="toolbar">
      <button id="export" class="btn hidden"><span class="label">Snapshot</span></button>
      <button id="status-action" class="btn warn hidden"></button>
      <button id="refresh" class="btn icon-btn" title="Refresh" aria-label="Refresh">↻</button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="side-head"><span class="eyebrow">Projects</span><span id="project-count" class="eyebrow">0</span></div>
    <div id="project-list" class="project-list"><div class="empty">Loading…</div></div>
  </aside>

  <main class="workspace">
    <div class="graph-tools"><button id="fit" class="btn icon-btn" title="Fit graph" aria-label="Fit graph">⌗</button></div>
    <div id="canvas-empty" class="canvas-empty"><div><strong>Select a Project</strong>Choose a project to inspect its proof graph.</div></div>
    <div id="viewport" class="hidden"><svg id="graph" role="img" aria-label="Project graph"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9a8fce"/></marker><marker id="arrow-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d29a48"/></marker></defs><g id="scene"></g></svg></div>
    <div id="legend" class="legend hidden"><span><i class="dot"></i>Fact</span><span><i class="dot intent"></i>Intent edge</span><span><i class="dot hint"></i>Hint</span></div>
  </main>

  <aside class="inspector">
    <div class="tabs"><button class="tab active" data-tab="detail">Detail</button><button class="tab" data-tab="hints">Hints <span id="hint-count">0</span></button></div>
    <div id="detail-panel" class="panel"><div class="placeholder">Select a Fact, Intent edge, or Hint.</div></div>
    <div id="hints-panel" class="panel hidden">
      <form id="hint-form" class="hint-compose">
        <label for="hint-content">Add guidance to this Project</label>
        <textarea id="hint-content" maxlength="16384" required placeholder="What should the runtime reconsider, verify, or prioritize?"></textarea>
        <div class="compose-foot"><div class="actor"><label for="hint-creator">Creator</label><input id="hint-creator" maxlength="120" value="human:web" required></div><button class="btn primary" type="submit">Add Hint</button></div>
      </form>
      <div id="hint-list" class="hint-list"></div>
    </div>
  </aside>
</div>
<div id="auth" class="auth hidden"><form id="auth-form" class="auth-card"><h2>API token required</h2><p>Enter the bearer token configured for this Peak server.</p><input id="token" type="password" autocomplete="current-password" required placeholder="Bearer token"><button class="btn primary" type="submit">Connect</button></form></div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module">
const $=(selector)=>document.querySelector(selector);
const ns='http://www.w3.org/2000/svg';
const state={projects:[],graph:null,resolved:new Map(),projectId:null,selected:null,tab:'detail',token:sessionStorage.getItem('peak-token')||'',signature:'',camera:{x:0,y:0,k:1},bounds:{width:1,height:1},fittedProject:null,refreshing:false};
const els={list:$('#project-list'),count:$('#project-count'),mobile:$('#mobile-projects'),heading:$('#project-heading'),title:$('#project-title'),status:$('#project-status'),statusAction:$('#status-action'),export:$('#export'),empty:$('#canvas-empty'),viewport:$('#viewport'),scene:$('#scene'),legend:$('#legend'),detail:$('#detail-panel'),hints:$('#hints-panel'),hintCount:$('#hint-count'),hintList:$('#hint-list'),hintForm:$('#hint-form'),content:$('#hint-content'),creator:$('#hint-creator'),auth:$('#auth'),token:$('#token'),toast:$('#toast')};
els.creator.value=localStorage.getItem('peak-hint-creator')||'human:web';

async function api(path,options={}){
  const headers=new Headers(options.headers||{});if(state.token)headers.set('authorization',`Bearer ${state.token}`);
  if(options.body&&!headers.has('content-type'))headers.set('content-type','application/json');
  const response=await fetch(path,{...options,headers});
  if(response.status===401){els.auth.classList.remove('hidden');throw new Error('Authentication required');}
  const text=await response.text();
  if(!response.ok){let message=text;try{message=JSON.parse(text).error||text}catch{}throw new Error(message||`HTTP ${response.status}`)}
  if(response.status===204||!text)return null;
  const type=response.headers.get('content-type')||'';return type.includes('json')?JSON.parse(text):text;
}
async function refresh(manual=false){
  if(state.refreshing)return;state.refreshing=true;
  try{
    const projects=await api('/api/projects');state.projects=projects;renderProjectList();
    if(state.projectId&&!projects.some(p=>p.id===state.projectId)){state.projectId=null;state.graph=null;history.replaceState(null,'',location.pathname);renderEmpty();}
    if(state.projectId)await loadGraph(manual);
    else if(projects.length===1)await selectProject(projects[0].id);
  }catch(error){if(error.message!=='Authentication required')notify(error.message,true)}finally{state.refreshing=false}
}
function renderProjectList(){
  els.count.textContent=String(state.projects.length);els.list.replaceChildren();els.mobile.replaceChildren();
  const option=document.createElement('option');option.value='';option.textContent='Select project';els.mobile.append(option);
  if(!state.projects.length){els.list.innerHTML='<div class="empty"><strong>No Projects</strong>Projects created by Peak will appear here.</div>';return}
  for(const project of state.projects){
    const button=document.createElement('button');button.className=`project-card${project.id===state.projectId?' active':''}`;button.type='button';
    const row=document.createElement('div');row.className='project-card-title';const title=document.createElement('span');title.textContent=project.title;const badge=document.createElement('span');badge.className=`status ${project.status}`;badge.textContent=project.status;row.append(title,badge);
    const date=document.createElement('p');date.textContent=`Created ${formatDate(project.createdAt)}`;const id=document.createElement('code');id.textContent=project.id;button.append(row,date,id);button.onclick=()=>selectProject(project.id);els.list.append(button);
    const item=document.createElement('option');item.value=project.id;item.textContent=`${project.title} · ${project.status}`;item.selected=project.id===state.projectId;els.mobile.append(item);
  }
}
async function selectProject(id){
  state.projectId=id;state.selected=null;state.signature='';state.fittedProject=null;location.hash=id;renderProjectList();await loadGraph(true);
}
async function loadGraph(force=false){
  const graph=await api(`/api/projects/${encodeURIComponent(state.projectId)}`);const signature=JSON.stringify(graph);
  const refs=[];const seen=new Set();for(const intent of graph.intents)for(const ref of intent.from)if(ref.projectId!==state.projectId){const key=refKey(ref);if(!seen.has(key)){seen.add(key);refs.push(ref)}}
  state.resolved=new Map();if(refs.length){try{const values=await api('/api/fact-refs/resolve',{method:'POST',body:JSON.stringify({targetProjectId:state.projectId,refs})});for(const value of values)state.resolved.set(refKey(value.ref),value.fact)}catch{}}
  const changed=signature!==state.signature;state.graph=graph;state.signature=signature;renderHeader();renderHints();
  if(changed||force){renderGraph();renderDetail();}
}
function renderHeader(){
  const graph=state.graph;if(!graph){renderEmpty();return}els.heading.classList.remove('hidden');els.export.classList.remove('hidden');els.statusAction.classList.remove('hidden');els.title.textContent=graph.project.title;els.status.className=`status ${graph.project.status}`;els.status.textContent=graph.project.status;
  if(graph.project.status==='completed'){els.statusAction.textContent='Reopen';els.statusAction.className='btn primary'}else{els.statusAction.textContent=graph.project.status==='active'?'Stop':'Resume';els.statusAction.className=graph.project.status==='active'?'btn warn':'btn primary'}
  els.empty.classList.add('hidden');els.viewport.classList.remove('hidden');els.legend.classList.remove('hidden');els.hintCount.textContent=String(graph.hints.length);els.hintForm.querySelector('button').disabled=false;
}
function renderEmpty(){state.graph=null;els.heading.classList.add('hidden');els.export.classList.add('hidden');els.statusAction.classList.add('hidden');els.viewport.classList.add('hidden');els.legend.classList.add('hidden');els.empty.classList.remove('hidden');els.hintCount.textContent='0';renderDetail();renderHints()}
function renderGraph(){
  els.scene.replaceChildren();if(!state.graph)return;const model=buildLayout(state.graph);state.bounds={width:model.width,height:model.height};
  for(const edge of model.edges)drawEdge(edge);
  for(const node of model.nodes)drawNode(node);
  applyCamera();if(state.fittedProject!==state.projectId){requestAnimationFrame(fitGraph);state.fittedProject=state.projectId}
}
function buildLayout(graph){
  const W=220,H=92,XG=48,YG=76,PAD=90;const nodes=new Map();
  for(const fact of graph.facts)nodes.set(`${graph.project.id}:${fact.id}`,{key:`${graph.project.id}:${fact.id}`,type:'fact',id:fact.id,description:fact.description,record:fact,depth:fact.id==='origin'?0:1});
  for(const intent of graph.intents)for(const ref of intent.from){const key=refKey(ref);if(!nodes.has(key)){const fact=state.resolved.get(key);nodes.set(key,{key,type:'external',id:ref.factId,projectId:ref.projectId,description:fact?.description||`FactRef from ${shortId(ref.projectId)}`,record:fact,depth:0})}}
  for(let pass=0;pass<graph.intents.length+2;pass++)for(const intent of graph.intents)if(intent.to){const target=nodes.get(refKey(intent.to));if(target){const sourceDepth=Math.max(...intent.from.map(ref=>nodes.get(refKey(ref))?.depth||0));target.depth=Math.max(target.depth,sourceDepth+1)}}
  const factDepths=[...nodes.values()].map(node=>node.depth);let maxDepth=Math.max(0,...factDepths);
  const goal=nodes.get(`${graph.project.id}:goal`);if(goal&&!graph.intents.some(intent=>intent.to?.factId==='goal'))goal.depth=maxDepth+1;
  for(const intent of graph.intents)if(!intent.to){const depth=Math.max(...intent.from.map(ref=>nodes.get(refKey(ref))?.depth||0))+1;nodes.set(`open:${intent.id}`,{key:`open:${intent.id}`,type:'open',id:intent.id,description:'Open intent',record:intent,depth})}
  maxDepth=Math.max(0,...[...nodes.values()].map(node=>node.depth));
  graph.hints.forEach((hint,index)=>nodes.set(`hint:${hint.id}`,{key:`hint:${hint.id}`,type:'hint',id:hint.id,description:hint.content,record:hint,depth:maxDepth+1,hintIndex:index}));
  const layers=new Map();for(const node of nodes.values()){const list=layers.get(node.depth)||[];list.push(node);layers.set(node.depth,list)}
  const maxRows=Math.max(1,...[...layers.values()].map(list=>list.length));const layoutDepth=Math.max(0,...layers.keys());const width=PAD*2+maxRows*W+(maxRows-1)*XG;const height=PAD*2+(layoutDepth+1)*H+layoutDepth*YG;
  for(const [depth,list] of layers){list.sort((a,b)=>nodeOrder(a)-nodeOrder(b)||a.id.localeCompare(b.id));const used=list.length*W+(list.length-1)*XG;const start=(width-used)/2;list.forEach((node,index)=>{node.x=start+index*(W+XG);node.y=PAD+depth*(H+YG);node.w=W;node.h=H})}
  const edges=[];
  for(const intent of graph.intents){const target=nodes.get(intent.to?refKey(intent.to):`open:${intent.id}`);if(!target)continue;for(const ref of intent.from){const source=nodes.get(refKey(ref));if(source)edges.push({id:intent.id,record:intent,source,target,open:!intent.to})}}
  return{nodes:[...nodes.values()],edges,width,height};
}
function drawEdge(edge){
  const x1=edge.source.x+edge.source.w/2,y1=edge.source.y+edge.source.h,x2=edge.target.x+edge.target.w/2,y2=edge.target.y,mid=(y1+y2)/2;const d=`M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
  const path=svg('path',{d,class:`edge${edge.open?' open':''}${state.selected?.type==='intent'&&state.selected.id===edge.id?' selected':''}`});const hit=svg('path',{d,class:'edge-hit'});hit.onclick=(event)=>{event.stopPropagation();selectItem('intent',edge.id)};const label=svg('text',{x:(x1+x2)/2+8,y:mid-7,class:'edge-label','text-anchor':'middle'});label.textContent=edge.id;label.onclick=(event)=>{event.stopPropagation();selectItem('intent',edge.id)};els.scene.append(path,hit,label);
}
function drawNode(node){
  const colors=nodeColors(node);const group=svg('g',{class:`graph-node${isSelectedNode(node)?' selected':''}`,transform:`translate(${node.x} ${node.y})`,tabindex:'0',role:'button'});const rect=svg('rect',{width:node.w,height:node.h,rx:13,fill:colors.fill,stroke:colors.stroke,'stroke-width':2});const type=svg('text',{x:14,y:20,class:'node-type',fill:colors.accent});type.textContent=node.type==='external'?'FACTREF':node.type.toUpperCase();const id=svg('text',{x:node.w-14,y:20,class:'node-id',fill:colors.accent,'text-anchor':'end'});id.textContent=node.id;
  group.append(rect,type,id);const lines=wrap(node.description,node.type==='open'?24:31,3);lines.forEach((line,index)=>{const text=svg('text',{x:14,y:44+index*16,class:'node-text'});text.textContent=line;group.append(text)});group.onclick=(event)=>{event.stopPropagation();if(node.type==='open')selectItem('intent',node.id);else selectItem(node.type==='hint'?'hint':'fact',node.key)};group.onkeydown=(event)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();group.onclick(event)}};els.scene.append(group);
}
function graphNodeForSelection(){if(!state.selected)return null;return state.selected.type==='fact'?state.selected.id:state.selected.type==='hint'?`hint:${state.selected.id}`:null}
function isSelectedNode(node){if(!state.selected)return false;if(state.selected.type==='intent'&&node.type==='open')return node.id===state.selected.id;return graphNodeForSelection()===node.key}
function selectItem(type,id){state.selected={type,id};renderGraph();renderDetail();if(type==='hint')setTab('hints')}
function renderDetail(){
  els.detail.replaceChildren();if(!state.graph||!state.selected){els.detail.innerHTML='<div class="placeholder">Select a Fact, Intent edge, or Hint.</div>';return}
  let title='',description='',meta=[];const {type,id}=state.selected;
  if(type==='intent'){const item=state.graph.intents.find(value=>value.id===id);if(!item)return;title=`Intent ${item.id}`;description=item.description;meta=[['Status',item.to?'concluded':'open'],['From',item.from.map(ref=>`${shortId(ref.projectId)}/${ref.factId}`).join(', ')],['To',item.to?item.to.factId:'—'],['Created by',item.createdBy],['Created',formatDate(item.createdAt)],['Concluded by',item.concludedBy||'—']];}
  else if(type==='hint'){const item=state.graph.hints.find(value=>value.id===id);if(!item)return;title=`Hint ${item.id}`;description=item.content;meta=[['Creator',item.creator],['Created',formatDate(item.createdAt)]];}
  else{const [projectId,factId]=splitRefKey(id);const local=projectId===state.projectId;const item=local?state.graph.facts.find(value=>value.id===factId):state.resolved.get(id);title=local?`Fact ${factId}`:`FactRef ${factId}`;description=item?.description||`External Fact from ${projectId}`;meta=[['Project',local?'current':projectId],['Created',item?.createdAt?formatDate(item.createdAt):'—'],['Artifact',item?.artifact?`${item.artifact.mediaType} · ${formatBytes(item.artifact.sizeBytes)}`:'—']];if(local&&item?.artifact)meta.push(['SHA-256',item.artifact.sha256]);}
  const card=document.createElement('article');card.className='detail-card';const head=document.createElement('div');head.className='detail-head';const code=document.createElement('code');code.textContent=title;head.append(code);const body=document.createElement('div');body.className='detail-body';const p=document.createElement('p');p.textContent=description;body.append(p);const dl=document.createElement('dl');dl.className='meta';for(const [key,value] of meta){const row=document.createElement('div');const dt=document.createElement('dt');dt.textContent=key;const dd=document.createElement('dd');dd.textContent=value;row.append(dt,dd);dl.append(row)}body.append(dl);card.append(head,body);els.detail.append(card);
}
function renderHints(){
  els.hintList.replaceChildren();const hints=state.graph?.hints||[];els.hintForm.classList.toggle('hidden',!state.graph);if(!hints.length){els.hintList.innerHTML='<div class="placeholder">No hints yet.</div>';return}
  for(const hint of [...hints].reverse()){const button=document.createElement('button');button.type='button';button.className=`hint-card${state.selected?.type==='hint'&&state.selected.id===hint.id?' selected':''}`;const meta=document.createElement('div');meta.className='hint-meta';const creator=document.createElement('strong');creator.textContent=hint.creator;const date=document.createElement('span');date.textContent=formatDate(hint.createdAt);meta.append(creator,date);const p=document.createElement('p');p.textContent=hint.content;button.append(meta,p);button.onclick=()=>selectItem('hint',hint.id);els.hintList.append(button)}
}
async function submitHint(event){event.preventDefault();if(!state.graph)return;const content=els.content.value.trim(),creator=els.creator.value.trim();if(!content||!creator)return;const submit=els.hintForm.querySelector('button');submit.disabled=true;try{localStorage.setItem('peak-hint-creator',creator);const hint=await api(`/api/projects/${state.projectId}/hints`,{method:'POST',body:JSON.stringify({content,creator})});els.content.value='';state.selected={type:'hint',id:hint.id};await loadGraph(true);notify('Hint added to the Project')}catch(error){notify(error.message,true)}finally{submit.disabled=false}}
async function changeStatus(){
  if(!state.graph)return;try{const project=state.graph.project;if(project.status==='completed'){const description=prompt('Describe why this Project should be reopened:');if(!description?.trim())return;await api(`/api/projects/${state.projectId}/reopen`,{method:'POST',body:JSON.stringify({description:description.trim(),creator:els.creator.value.trim()||'human:web'})});notify('Project reopened')}else{const status=project.status==='active'?'stopped':'active';await api(`/api/projects/${state.projectId}/status`,{method:'PUT',body:JSON.stringify({status})});notify(`Project ${status}`)}await refresh(true)}catch(error){notify(error.message,true)}
}
async function exportSnapshot(){try{const text=await api(`/api/projects/${state.projectId}/export?format=yaml`);const blob=new Blob([text],{type:'application/yaml'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`peak-${state.projectId}.yaml`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}catch(error){notify(error.message,true)}}
function setTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));els.detail.classList.toggle('hidden',tab!=='detail');els.hints.classList.toggle('hidden',tab!=='hints');if(tab==='hints')renderHints()}
function fitGraph(){if(!state.graph)return;const box=els.viewport.getBoundingClientRect(),pad=55;const k=Math.min(1.25,Math.max(.18,Math.min((box.width-pad*2)/state.bounds.width,(box.height-pad*2)/state.bounds.height)));state.camera={k,x:(box.width-state.bounds.width*k)/2,y:(box.height-state.bounds.height*k)/2};applyCamera()}
function applyCamera(){els.scene.setAttribute('transform',`translate(${state.camera.x} ${state.camera.y}) scale(${state.camera.k})`)}
function setupPanZoom(){let drag=null;els.viewport.addEventListener('pointerdown',event=>{if(event.target.closest?.('.graph-node,.edge-hit,.edge-label'))return;drag={x:event.clientX,y:event.clientY,cx:state.camera.x,cy:state.camera.y};els.viewport.setPointerCapture(event.pointerId);els.viewport.classList.add('dragging')});els.viewport.addEventListener('pointermove',event=>{if(!drag)return;state.camera.x=drag.cx+event.clientX-drag.x;state.camera.y=drag.cy+event.clientY-drag.y;applyCamera()});const end=()=>{drag=null;els.viewport.classList.remove('dragging')};els.viewport.addEventListener('pointerup',end);els.viewport.addEventListener('pointercancel',end);els.viewport.addEventListener('wheel',event=>{event.preventDefault();const rect=els.viewport.getBoundingClientRect(),px=event.clientX-rect.left,py=event.clientY-rect.top,old=state.camera.k,next=Math.min(2.5,Math.max(.16,old*Math.exp(-event.deltaY*.001)));state.camera.x=px-(px-state.camera.x)*(next/old);state.camera.y=py-(py-state.camera.y)*(next/old);state.camera.k=next;applyCamera()},{passive:false})}
function notify(message,error=false){els.toast.textContent=message;els.toast.className=`toast${error?' error':''}`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>els.toast.classList.add('hidden'),2800)}
function svg(tag,attributes){const element=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attributes))element.setAttribute(key,String(value));return element}
function nodeColors(node){if(node.type==='hint')return{fill:'#fffaf0',stroke:'#e5aa4d',accent:'#b87413'};if(node.type==='open')return{fill:'#fffdf8',stroke:'#d7a65e',accent:'#ad701c'};if(node.type==='external')return{fill:'#f5f3ff',stroke:'#8b7fd1',accent:'#6659aa'};if(node.id==='origin')return{fill:'#effcf8',stroke:'#32a996',accent:'#087f72'};if(node.id==='goal')return{fill:'#fff2f4',stroke:'#e27587',accent:'#bf3f56'};return{fill:'#f5f6ff',stroke:'#7168d5',accent:'#5146bd'}}
function nodeOrder(node){if(node.id==='origin')return-10;if(node.type==='external')return-5;if(node.id==='goal')return 10;if(node.type==='hint')return 20+(node.hintIndex||0);return 0}
function wrap(value,width,max){const chars=[...String(value).replace(/\s+/g,' ').trim()];const lines=[];while(chars.length&&lines.length<max){let end=Math.min(width,chars.length);if(end<chars.length){const slice=chars.slice(0,end+1).join(''),space=slice.lastIndexOf(' ');if(space>width*.45)end=space}let line=chars.splice(0,end).join('').trim();while(chars[0]===' ')chars.shift();if(lines.length===max-1&&chars.length)line=`${line.slice(0,Math.max(0,width-1))}…`;lines.push(line)}return lines.length?lines:['—']}
function refKey(ref){return`${ref.projectId}:${ref.factId}`}function splitRefKey(key){const index=key.lastIndexOf(':');return[key.slice(0,index),key.slice(index+1)]}function shortId(id){return id===state.projectId?'current':id.slice(0,8)}
function formatDate(value){if(!value)return'—';return new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}function formatBytes(value){if(value<1024)return`${value} B`;if(value<1048576)return`${(value/1024).toFixed(1)} KiB`;return`${(value/1048576).toFixed(1)} MiB`}

document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>setTab(button.dataset.tab));els.hintForm.onsubmit=submitHint;els.statusAction.onclick=changeStatus;els.export.onclick=exportSnapshot;$('#fit').onclick=fitGraph;$('#refresh').onclick=()=>refresh(true);els.mobile.onchange=()=>els.mobile.value&&selectProject(els.mobile.value);els.auth.querySelector('form').onsubmit=async event=>{event.preventDefault();state.token=els.token.value.trim();sessionStorage.setItem('peak-token',state.token);els.auth.classList.add('hidden');await refresh(true)};window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&id!==state.projectId)selectProject(id)});window.addEventListener('resize',()=>{if(state.graph&&state.fittedProject!==state.projectId)fitGraph()});setupPanZoom();
const initial=location.hash.slice(1);if(initial)state.projectId=initial;await refresh(true);setInterval(()=>{if(!document.hidden)refresh(false)},2500);
</script>
